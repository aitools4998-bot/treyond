<!DOCTYPE html><html lang="en"><head>
<link rel="icon" type="image/x-icon" href="https://pub-1b08920c6acc4bb5baf433020a5e3b47.r2.dev/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://pub-1b08920c6acc4bb5baf433020a5e3b47.r2.dev/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://pub-1b08920c6acc4bb5baf433020a5e3b47.r2.dev/favicon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://pub-1b08920c6acc4bb5baf433020a5e3b47.r2.dev/favicon-512x512.png">
<link rel="apple-touch-icon" href="https://pub-1b08920c6acc4bb5baf433020a5e3b47.r2.dev/apple-touch-icon.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — Treyond World</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/nav.css"><link rel="stylesheet" href="/css/footer.css"></head><body>
<header id="site-header" class="site-header"><div class="container header-inner"><button id="mobile-menu-btn" class="mobile-menu-btn"><span></span><span></span><span></span></button><a href="/index.html" class="nav-logo">TREYOND WORLD</a><nav class="nav-menu"><div class="nav-item"><a href="/index.html" class="nav-link">Home</a></div><div class="nav-item"><a href="/uniforms" class="nav-link">Uniforms</a></div><div class="nav-item"><a hr="/shirts" class="nav-link">Shirts</a></div><div class="nav-item"><a href="/blazers" class="nav-link">Blazers</a></div><div class="nav-item"><a href="/suits" class="nav-link">Suits</a></div></nav><div class="nav-icons"><button id="cart-icon" class="nav-icon-btn"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><span class="cart-badge" style="display:none">0</span></button></div></div></header>
<main class="container" style="max-width:900px;padding-top:60px;padding-bottom:80px">
<h1 style="font-family:var(--font-serif);font-size:2rem;font-weight:400;margin-bottom:32px">Shopping Bag</h1>
<div style="display:grid;grid-template-columns:1fr 340px;gap:40px">
<div id="cart-items-container">
  <div id="cart-empty" style="text-align:center;padding:60px 0;color:var(--gray-400);display:none">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="48" height="48" style="margin:0 auto 16px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
    <p style="font-size:1.1rem;margin-bottom:16px">Your bag is empty</p>
    <a href="/index.html" class="btn btn-primary">Continue Shopping</a>
  </div>
  <div id="cart-items-list"></div>
</div>
<div style="background:var(--gray-50);padding:32px;height:fit-content">
  <h2 style="font-size:1rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:24px">Order Summary</h2>
  <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:.9rem"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div>
  <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:.9rem"><span>Shipping</span><span id="summary-shipping">₹99</span></div>
  <div style="border-top:1px solid var(--gray-200);margin:16px 0;padding-top:16px;display:flex;justify-content:space-between;font-weight:600"><span>Total</spspan id="summary-total">₹0</span></div>
  <a href="/checkout.html" class="btn btn-primary w-full" style="margin-top:16px;display:block;text-align:center">Proceed to Checkout</a>
  <a href="/index.html" class="btn btn-outline w-full" style="margin-top:12px;display:block;text-align:center">Continue Shopping</a>
</div>
</div>
</main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© 2025 Treyond World. All rights reserved.</span></div></div></footer>
<script src="/js/global.js"></script>
<script>
function renderCart() {
  const cart = Cart.getItems();
  const list = document.getElementById('cart-items-list');
  const empty = document.getElementById('cart-empty');
  if (!cart.length) { empty.style.display='block'; return; }
  let total = 0;
  list.innerHTML = cart.map((item,i) => {
    total += item.price * (item.qty||1);
    return `<div style="display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--gray-200)">
      <img src="${item.image||''}" style="width:80height:100px;object-fit:cover;background:var(--gray-100)">
      <div style="flex:1">
        <div style="font-weight:500;margin-bottom:4px">${item.name}</div>
        <div style="font-size:.85rem;color:var(--gray-500);margin-bottom:8px">Size: ${item.variant||'—'}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600">₹${item.price}</span>
          <button onclick="Cart.remove('${item.id}','${item.variant}');renderCart()" style="font-size:.75rem;color:var(--gray-400);text-decoration:underline;background:none;border:none;cursor:pointer">Remove</button>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('summary-subtotal').textContent = '₹'+total.toLocaleString();
  document.getElementById('summary-total').textContent = '₹'+total.toLocaleString();
  document.getElementById('summary-shipping').textContent = total>=2999 ? 'Free' : '₹99';
}
renderCart();
</script>
<script src="/js/seo.js"></script>
</body></html>
