</main>
<script src="/js/global.js"></script>
<script>
const order = JSON.parse(sessionStorage.getItem('treyond_last_order') || '{}');
if (order.id) {
  document.getElementById('conf-order-id').textContent = order.id;
  document.getElementById('conf-name').textContent = order.name;
  document.getElementById('conf-phone').textContent = order.phone;
  document.getElementById('conf-phone-note').textContent = order.phone;
  document.getElementById('conf-address').textContent = order.address;
  document.getElementById('conf-total').textContent = '₹' + order.total;
  document.getElementById('conf-items').innerHTML = (order.items || []).map(i =>
    `<div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:.85rem"><span>${i.name} x${i.qty}</span><span>₹${i.price * i.qty}</span></div>`
  ).join('');
}
</script>
